<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assetto Corsa Championship Manager</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        racing: {
                            dark: '#070a10',
                            card: '#0f172a',
                            cardBorder: '#1e293b',
                            accent: '#10b981',
                            red: '#e11d48',
                            redHover: '#f43f5e',
                            gold: '#f59e0b',
                            silver: '#cbd5e1',
                            bronze: '#d97706'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Rajdhani', 'sans-serif'],
                        mono: ['JetBrains Mono', 'Fira Code', 'monospace']
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Rajdhani:wght@500;600;700;800&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #070a10; color: #f8fafc; }
        .font-display { font-family: 'Rajdhani', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        [x-cloak] { display: none !important; }
        ::-webkit-scrollbar { height: 6px; width: 6px; }
        ::-webkit-scrollbar-track { background: #070a10; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }
    </style>
</head>
<body class="bg-racing-dark text-slate-100 min-h-screen flex flex-col selection:bg-racing-red selection:text-white">

    <div x-data="championshipApp()" x-init="initApp()" x-cloak class="flex flex-col min-h-screen">
        
        <!-- TOP HEADER / TELEMETRY BAR -->
        <header class="bg-racing-card/95 border-b border-racing-cardBorder sticky top-0 z-50 shadow-2xl backdrop-blur-md">
            <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-3">
                
                <!-- Logo & Track Specs Info -->
                <div class="flex items-center justify-between w-full md:w-auto gap-4">
                    <div class="flex items-center gap-3">
                        <div class="bg-gradient-to-br from-red-600 to-racing-red p-2.5 rounded-xl shadow-lg shadow-red-600/30 text-white">
                            <i class="fa-solid fa-flag-checkered text-2xl"></i>
                        </div>
                        <div>
                            <h1 class="font-display text-2xl font-black tracking-wider text-white uppercase flex items-center gap-2 leading-none">
                                ASSETTO CORSA <span class="text-racing-red text-[10px] px-2 py-0.5 bg-red-500/10 border border-red-500/30 rounded font-bold">TELEMETRY PRO</span>
                            </h1>
                            <p class="text-xs text-slate-400 mt-1 flex items-center gap-2">
                                <span><i class="fa-regular fa-clock text-racing-accent"></i> 5 Min Aquecimento</span>
                                <span>&bull;</span>
                                <span><i class="fa-solid fa-rotate-right text-racing-accent"></i> 10 Voltas/Pista</span>
                                <span>&bull;</span>
                                <span><i class="fa-solid fa-road text-racing-accent"></i> <span x-text="`${numTracks} Etapas`"></span></span>
                            </p>
                        </div>
                    </div>

                    <!-- Reset & Actions Mobile Toggle -->
                    <div class="md:hidden flex items-center gap-2">
                        <template x-if="started">
                            <button @click="resetModalOpen = true" class="p-2 text-red-400 bg-red-500/10 rounded-lg border border-red-500/20 text-xs">
                                <i class="fa-solid fa-rotate-left"></i>
                            </button>
                        </template>
                    </div>
                </div>

                <!-- Navigation Tabs (Only when championship is active) -->
                <template x-if="started">
                    <nav class="flex flex-wrap items-center justify-center gap-1 bg-racing-dark/80 p-1.5 rounded-xl border border-racing-cardBorder w-full md:w-auto max-w-full overflow-x-auto">
                        <button @click="currentTab = 'standings'" 
                                :class="currentTab === 'standings' ? 'bg-racing-red text-white font-bold shadow-lg shadow-red-600/30' : 'text-slate-400 hover:text-white hover:bg-slate-800/60'"
                                class="px-3 py-1.5 rounded-lg text-xs font-display tracking-wide transition-all flex items-center gap-1.5">
                            <i class="fa-solid fa-trophy"></i>
                            <span>Geral</span>
                        </button>

                        <template x-for="(tName, tIdx) in trackNames" :key="tIdx">
                            <button @click="currentTab = `track_${tIdx}`"
                                    :class="currentTab === `track_${tIdx}` ? 'bg-slate-700 text-white font-bold' : 'text-slate-400 hover:text-white hover:bg-slate-800/60'"
                                    class="px-2.5 py-1.5 rounded-lg text-xs font-display tracking-wide transition-all flex items-center gap-1">
                                <span x-text="`E${tIdx + 1}`" class="font-bold"></span>
                                <i :class="isTrackCompleted(tIdx) ? 'fa-solid fa-circle-check text-racing-accent' : 'fa-regular fa-circle text-slate-600'" class="text-[10px]"></i>
                            </button>
                        </template>

                        <button @click="currentTab = 'stats'"
                                :class="currentTab === 'stats' ? 'bg-slate-700 text-white font-bold' : 'text-slate-400 hover:text-white hover:bg-slate-800/60'"
                                class="px-3 py-1.5 rounded-lg text-xs font-display tracking-wide transition-all flex items-center gap-1.5">
                            <i class="fa-solid fa-chart-line"></i>
                            <span>Stats</span>
                        </button>

                        <button @click="currentTab = 'settings'"
                                :class="currentTab === 'settings' ? 'bg-slate-700 text-white font-bold' : 'text-slate-400 hover:text-white hover:bg-slate-800/60'"
                                class="px-2.5 py-1.5 rounded-lg text-xs font-display tracking-wide transition-all flex items-center gap-1.5">
                            <i class="fa-solid fa-gear"></i>
                        </button>
                    </nav>
                </template>

                <!-- Status Badge -->
                <template x-if="started">
                    <div class="hidden md:flex items-center gap-2 text-xs text-emerald-400 bg-emerald-500/10 px-3 py-1.5 rounded-xl border border-emerald-500/20">
                        <i class="fa-solid fa-floppy-disk"></i>
                        <span>Auto-salvo</span>
                    </div>
                </template>

            </div>
        </header>

        <!-- MAIN CONTENT AREA -->
        <main class="flex-grow max-w-7xl w-full mx-auto p-4 sm:p-6">

            <!-- ==================================================== -->
            <!-- CONFIGURATION SETUP SCREEN (BEFORE START)            -->
            <!-- ==================================================== -->
            <template x-if="!started">
                <div class="max-w-4xl mx-auto space-y-6">
                    <div class="bg-racing-card border border-racing-cardBorder rounded-2xl p-6 sm:p-8 shadow-2xl relative overflow-hidden">
                        
                        <!-- Top Accent Line -->
                        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-red-600 via-racing-accent to-blue-600"></div>

                        <div class="text-center max-w-2xl mx-auto mb-8">
                            <h2 class="font-display text-3xl sm:text-4xl font-extrabold tracking-wide text-white mb-2">CONFIGURAÇÃO DO CAMPEONATO</h2>
                            <p class="text-sm text-slate-400">Personalize pilotos (4-10), carros (1-10), pistas (1-20) e regras do torneio.</p>
                        </div>

                        <div class="space-y-8">
                            
                            <!-- 1. Player Count, Track Count & Fast Lap Toggle -->
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                                <!-- Number of Players Slider -->
                                <div class="bg-racing-dark/80 p-5 rounded-xl border border-racing-cardBorder flex flex-col justify-between">
                                    <div>
                                        <label class="font-display text-base font-bold text-slate-200 mb-2 flex justify-between items-center">
                                            <span><i class="fa-solid fa-users text-racing-red mr-2"></i> Pilotos</span>
                                            <span class="text-racing-red font-mono text-2xl font-black" x-text="numPlayers"></span>
                                        </label>
                                        <p class="text-xs text-slate-400 mb-4">4 a 10 participantes.</p>
                                    </div>
                                    <div>
                                        <input type="range" min="4" max="10" x-model.number="numPlayers" @input="updatePlayerCount()"
                                               class="w-full h-2.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-red-600">
                                        <div class="flex justify-between text-xs text-slate-500 font-mono mt-2">
                                            <span>4</span>
                                            <span>7</span>
                                            <span>10</span>
                                        </div>
                                    </div>
                                </div>

                                <!-- Number of Tracks Slider -->
                                <div class="bg-racing-dark/80 p-5 rounded-xl border border-racing-cardBorder flex flex-col justify-between">
                                    <div>
                                        <label class="font-display text-base font-bold text-slate-200 mb-2 flex justify-between items-center">
                                            <span><i class="fa-solid fa-road text-blue-400 mr-2"></i> Pistas</span>
                                            <span class="text-blue-400 font-mono text-2xl font-black" x-text="numTracks"></span>
                                        </label>
                                        <p class="text-xs text-slate-400 mb-4">1 a 20 pistas.</p>
                                    </div>
                                    <div>
                                        <input type="range" min="1" max="20" x-model.number="numTracks" @input="updateTrackCount()"
                                               class="w-full h-2.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-blue-500">
                                        <div class="flex justify-between text-xs text-slate-500 font-mono mt-2">
                                            <span>1</span>
                                            <span>10</span>
                                            <span>20</span>
                                        </div>
                                    </div>
                                </div>

                                <!-- Number of Car Types Slider -->
                                <div class="bg-racing-dark/80 p-5 rounded-xl border border-racing-cardBorder flex flex-col justify-between">
                                    <div>
                                        <label class="font-display text-base font-bold text-slate-200 mb-2 flex justify-between items-center">
                                            <span><i class="fa-solid fa-car-side text-racing-gold mr-2"></i> Modelos de Carro</span>
                                            <span class="text-racing-gold font-mono text-2xl font-black" x-text="numCars"></span>
                                        </label>
                                        <p class="text-xs text-slate-400 mb-4">1 a 10 veículos/classes.</p>
                                    </div>
                                    <div>
                                        <input type="range" min="1" max="10" x-model.number="numCars" @input="updateCarCount()"
                                               class="w-full h-2.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-amber-500">
                                        <div class="flex justify-between text-xs text-slate-500 font-mono mt-2">
                                            <span>1</span>
                                            <span>5</span>
                                            <span>10</span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Fast Lap Toggle & Points Info -->
                            <div class="bg-racing-dark/80 p-5 rounded-xl border border-racing-cardBorder">
                                <div class="flex justify-between items-center mb-2">
                                    <label class="font-display text-base font-bold text-slate-200">
                                        <i class="fa-solid fa-bolt text-racing-gold mr-2"></i> Bônus de Volta Mais Rápida (+1 pt)
                                    </label>
                                    <input type="checkbox" x-model="fastestLapBonusEnabled" 
                                           class="w-5 h-5 rounded border-slate-700 bg-slate-800 text-racing-red focus:ring-racing-red accent-red-600 cursor-pointer">
                                </div>
                                <div class="bg-slate-900/90 p-3 rounded-lg border border-slate-800 text-xs text-slate-300 mt-2">
                                    <span class="font-bold text-white block mb-1">Pontuação Padrão (1º ao <span x-text="numPlayers + 'º'"></span>):</span>
                                    <div class="flex flex-wrap gap-1 font-mono text-[11px] text-slate-400">
                                        <template x-for="pos in numPlayers" :key="pos">
                                            <span class="bg-slate-800 px-1.5 py-0.5 rounded border border-slate-700">
                                                <span class="text-slate-500" x-text="pos+'º:'"></span>
                                                <span class="text-racing-accent font-bold" x-text="scoringScheme[pos - 1] || 0"></span>
                                            </span>
                                        </template>
                                    </div>
                                </div>
                            </div>

                            <!-- 2. Drivers Names Registration -->
                            <div class="space-y-3">
                                <h3 class="font-display text-base font-bold text-slate-200 uppercase tracking-wider flex items-center gap-2">
                                    <i class="fa-solid fa-id-card text-racing-red"></i> Pilotos Cadastrados
                                </h3>
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    <template x-for="(player, index) in players" :key="index">
                                        <div class="flex items-center gap-2 bg-racing-dark/90 p-2.5 rounded-xl border border-racing-cardBorder focus-within:border-racing-red transition-all">
                                            <span class="w-8 h-8 rounded-lg bg-slate-800 text-racing-red font-mono text-sm flex items-center justify-center font-bold flex-shrink-0" x-text="index + 1"></span>
                                            <input type="text" x-model="players[index]" :placeholder="`Piloto ${index + 1}`"
                                                   class="w-full bg-transparent border-none text-white focus:outline-none text-sm font-medium placeholder-slate-600">
                                        </div>
                                    </template>
                                </div>
                            </div>

                            <!-- 3. Car Models Registration -->
                            <div class="space-y-3">
                                <h3 class="font-display text-base font-bold text-slate-200 uppercase tracking-wider flex items-center gap-2">
                                    <i class="fa-solid fa-car text-racing-gold"></i> Modelos / Classes de Veículos
                                </h3>
                                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                                    <template x-for="(car, cIndex) in carNames" :key="cIndex">
                                        <div class="flex items-center gap-2 bg-racing-dark/90 p-2.5 rounded-xl border border-racing-cardBorder focus-within:border-amber-500 transition-all">
                                            <span class="w-8 h-8 rounded-lg bg-slate-800 text-amber-400 font-mono text-xs flex items-center justify-center font-bold flex-shrink-0" x-text="`C${cIndex + 1}`"></span>
                                            <input type="text" x-model="carNames[cIndex]" :placeholder="`Carro ${cIndex + 1}`"
                                                   class="w-full bg-transparent border-none text-white focus:outline-none text-sm font-medium placeholder-slate-600">
                                        </div>
                                    </template>
                                </div>
                            </div>

                            <!-- 4. Customizable Track Names -->
                            <div class="space-y-3">
                                <h3 class="font-display text-base font-bold text-slate-200 uppercase tracking-wider flex items-center gap-2">
                                    <i class="fa-solid fa-map-location-dot text-blue-400"></i> Nomes das Pistas (<span x-text="numTracks"></span>)
                                </h3>
                                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                                    <template x-for="(track, tIndex) in trackNames" :key="tIndex">
                                        <div class="flex items-center gap-2 bg-racing-dark/90 p-2.5 rounded-xl border border-racing-cardBorder focus-within:border-blue-500 transition-all">
                                            <span class="w-8 h-8 rounded-lg bg-slate-800 text-blue-400 font-mono text-xs flex items-center justify-center font-bold flex-shrink-0" x-text="`E${tIndex + 1}`"></span>
                                            <input type="text" x-model="trackNames[tIndex]" :placeholder="`Pista ${tIndex + 1}`"
                                                   class="w-full bg-transparent border-none text-white focus:outline-none text-sm font-medium placeholder-slate-600">
                                        </div>
                                    </template>
                                </div>
                            </div>

                            <!-- Action Button -->
                            <div class="pt-4">
                                <button @click="startChampionship()"
                                        class="w-full py-4 bg-gradient-to-r from-red-600 to-racing-red hover:from-red-500 hover:to-red-600 text-white font-display text-lg font-bold tracking-wider rounded-xl shadow-xl shadow-red-600/25 transition-all transform active:scale-[0.99] flex items-center justify-center gap-3">
                                    <i class="fa-solid fa-play text-xl"></i>
                                    <span>INICIAR CAMPEONATO</span>
                                </button>
                            </div>

                        </div>
                    </div>
                </div>
            </template>

            <!-- ==================================================== -->
            <!-- ACTIVE CHAMPIONSHIP MANAGER DASHBOARD                -->
            <!-- ==================================================== -->
            <template x-if="started">
                <div class="space-y-6">

                    <!-- CHAMPIONSHIP PROGRESS BAR -->
                    <div class="bg-racing-card border border-racing-cardBorder p-4 rounded-xl flex flex-col sm:flex-row justify-between items-center gap-3 shadow-lg">
                        <div class="flex items-center gap-3 w-full sm:w-auto">
                            <div class="text-xs font-display uppercase tracking-wider text-slate-400">Progresso do Campeonato:</div>
                            <div class="font-mono font-bold text-racing-accent text-sm bg-racing-accent/10 px-2.5 py-0.5 rounded border border-racing-accent/20" x-text="`${completedTracksCount}/${numTracks} Pistas Concluídas`"></div>
                        </div>
                        <div class="w-full sm:w-64 bg-racing-dark h-2.5 rounded-full overflow-hidden border border-slate-800">
                            <div class="bg-gradient-to-r from-red-600 to-racing-accent h-full transition-all duration-500" :style="{ width: `${(completedTracksCount / numTracks) * 100}%` }"></div>
                        </div>
                    </div>

                    <!-- TAB 1: STANDINGS / LEADERBOARD VIEW -->
                    <div x-show="currentTab === 'standings'" class="space-y-6">
                        
                        <!-- PODIUM VISUAL HIGHLIGHT -->
                        <template x-if="sortedStandings.length >= 3">
                            <div class="grid grid-cols-3 gap-3 sm:gap-6 pt-2">
                                
                                <!-- 2nd Place -->
                                <div class="bg-gradient-to-b from-slate-800/80 to-racing-card border border-slate-700/60 rounded-2xl p-4 text-center flex flex-col justify-between shadow-xl order-1 mt-4">
                                    <div>
                                        <div class="w-10 h-10 sm:w-12 sm:h-12 mx-auto rounded-full bg-slate-300/20 border border-slate-300/40 text-slate-200 flex items-center justify-center font-display font-black text-lg shadow-inner mb-2">
                                            2º
                                        </div>
                                        <p class="font-display font-extrabold text-sm sm:text-lg text-white truncate" x-text="sortedStandings[1]?.name"></p>
                                        <p class="text-xs text-slate-400 font-mono" x-text="sortedStandings[1]?.wins + ' Vitórias'"></p>
                                    </div>
                                    <div class="mt-3 pt-2 border-t border-slate-800">
                                        <span class="font-mono text-xl sm:text-2xl font-black text-slate-200" x-text="sortedStandings[1]?.totalPoints"></span>
                                        <span class="text-[10px] text-slate-500 uppercase block font-display">Pontos</span>
                                    </div>
                                </div>

                                <!-- 1st Place (Gold Winner) -->
                                <div class="bg-gradient-to-b from-amber-500/20 via-racing-card to-racing-card border-2 border-amber-500/50 rounded-2xl p-4 text-center flex flex-col justify-between shadow-2xl order-2 relative transform -translate-y-2">
                                    <div class="absolute -top-3 left-1/2 -translate-x-1/2 bg-amber-500 text-black px-3 py-0.5 rounded-full text-[10px] font-black uppercase tracking-wider font-display shadow-md">
                                        LÍDER
                                    </div>
                                    <div>
                                        <div class="w-12 h-12 sm:w-14 sm:h-14 mx-auto rounded-full bg-amber-500/30 border-2 border-amber-400 text-amber-300 flex items-center justify-center font-display font-black text-xl shadow-lg mb-2">
                                            <i class="fa-solid fa-crown"></i>
                                        </div>
                                        <p class="font-display font-black text-base sm:text-xl text-amber-300 truncate" x-text="sortedStandings[0]?.name"></p>
                                        <p class="text-xs text-amber-400/80 font-mono" x-text="sortedStandings[0]?.wins + ' Vitórias'"></p>
                                    </div>
                                    <div class="mt-3 pt-2 border-t border-amber-500/20">
                                        <span class="font-mono text-2xl sm:text-3xl font-black text-amber-400" x-text="sortedStandings[0]?.totalPoints"></span>
                                        <span class="text-[10px] text-amber-500/80 uppercase block font-display font-bold">Pontos</span>
                                    </div>
                                </div>

                                <!-- 3rd Place -->
                                <div class="bg-gradient-to-b from-amber-900/20 to-racing-card border border-amber-800/40 rounded-2xl p-4 text-center flex flex-col justify-between shadow-xl order-3 mt-6">
                                    <div>
                                        <div class="w-10 h-10 sm:w-12 sm:h-12 mx-auto rounded-full bg-amber-700/20 border border-amber-700/40 text-amber-500 flex items-center justify-center font-display font-black text-lg shadow-inner mb-2">
                                            3º
                                        </div>
                                        <p class="font-display font-extrabold text-sm sm:text-lg text-white truncate" x-text="sortedStandings[2]?.name"></p>
                                        <p class="text-xs text-slate-400 font-mono" x-text="sortedStandings[2]?.wins + ' Vitórias'"></p>
                                    </div>
                                    <div class="mt-3 pt-2 border-t border-slate-800">
                                        <span class="font-mono text-xl sm:text-2xl font-black text-amber-500" x-text="sortedStandings[2]?.totalPoints"></span>
                                        <span class="text-[10px] text-slate-500 uppercase block font-display">Pontos</span>
                                    </div>
                                </div>

                            </div>
                        </template>

                        <!-- FULL LEADERBOARD TABLE -->
                        <div class="bg-racing-card border border-racing-cardBorder rounded-2xl overflow-hidden shadow-2xl">
                            <div class="p-5 border-b border-racing-cardBorder flex justify-between items-center flex-wrap gap-2">
                                <h3 class="font-display text-xl font-bold text-white uppercase tracking-wider flex items-center gap-2">
                                    <i class="fa-solid fa-ranking-star text-racing-gold"></i> Tabela Geral de Pontuação
                                </h3>
                                <div class="text-xs text-slate-400">
                                    Desempate: Pontos &rarr; Vitórias &rarr; Pódios &rarr; Voltas Rápidas
                                </div>
                            </div>

                            <div class="overflow-x-auto">
                                <table class="w-full text-left border-collapse">
                                    <thead>
                                        <tr class="bg-racing-dark/90 border-b border-racing-cardBorder text-[11px] font-display tracking-wider text-slate-400 uppercase">
                                            <th class="py-3.5 px-4 text-center w-14">POS</th>
                                            <th class="py-3.5 px-6">PILOTO</th>
                                            <th class="py-3.5 px-3 text-center" title="Vitórias"><i class="fa-solid fa-trophy text-racing-gold"></i> VIT</th>
                                            <th class="py-3.5 px-3 text-center" title="Pódios"><i class="fa-solid fa-award text-slate-300"></i> POD</th>
                                            <th class="py-3.5 px-3 text-center" title="Voltas Mais Rápidas"><i class="fa-solid fa-bolt text-yellow-400"></i> FL</th>
                                            <template x-for="(tName, tIdx) in trackNames" :key="tIdx">
                                                <th class="py-3.5 px-3 text-center font-mono whitespace-nowrap" x-text="`E${tIdx+1}`" :title="tName"></th>
                                            </template>
                                            <th class="py-3.5 px-6 text-right font-bold text-white">TOTAL PTS</th>
                                        </tr>
                                    </thead>

    <!-- APP LOGIC SCRIPT -->
    <script>
        function championshipApp() {
            return {
                started: false,
                currentTab: 'standings',
                numPlayers: 6,
                numTracks: 6,
                numCars: 3,
                fastestLapBonusEnabled: true,
                resetModalOpen: false,
                
                // Scoring Formula Base F1 Style
                scoringScheme: [25, 18, 15, 12, 10, 8, 6, 4, 2, 1],
                
                // Drivers list
                players: ['Piloto 1', 'Piloto 2', 'Piloto 3', 'Piloto 4', 'Piloto 5', 'Piloto 6'],
                
                // Cars list (Up to 10)
                carNames: ['Porsche 911 GT3 R', 'BMW M4 GT3', 'Ferrari 296 GT3'],

                // Default Track Names (Up to 20)
                defaultTracks: [
                    'Monza', 'Spa-Francorchamps', 'Nürburgring', 'Red Bull Ring', 'Interlagos', 'Silverstone',
                    'Imola', 'Brands Hatch', 'Suzuka', 'Laguna Seca', 'Barcelona', 'Paul Ricard',
                    'Zandvoort', 'Hungaroring', 'Kyalami', 'Mount Panorama', 'Misano', 'Donington', 'Oulton Park', 'Sebring'
                ],
                trackNames: [],

                // Stores track positions, assigned car, and fastest lap driver index
                // trackResults[trackIndex] = { positions: [posPlayer0, ...], cars: [carPlayer0, ...], fastestLap: driverIndexOrNull }
                trackResults: [],

                initApp() {
                    const saved = localStorage.getItem('assetto_corsa_championship_data');
                    if (saved) {
                        try {
                            const parsed = JSON.parse(saved);
                            this.started = parsed.started || false;
                            this.numPlayers = parsed.numPlayers || 6;
                            this.numTracks = parsed.numTracks || 6;
                            this.numCars = parsed.numCars || 3;
                            this.fastestLapBonusEnabled = parsed.fastestLapBonusEnabled !== undefined ? parsed.fastestLapBonusEnabled : true;
                            this.players = parsed.players || this.players;
                            this.carNames = parsed.carNames || this.carNames;
                            this.trackNames = parsed.trackNames || this.defaultTracks.slice(0, this.numTracks);
                            this.trackResults = parsed.trackResults || [];
                        } catch (e) {
                            console.error('Error loading localStorage:', e);
                        }
                    } else {
                        this.trackNames = this.defaultTracks.slice(0, this.numTracks);
                    }
                    if (!this.trackResults || this.trackResults.length === 0) {
                        this.initTrackResults();
                    }
                },

                initTrackResults() {
                    this.trackResults = Array.from({ length: this.numTracks }, () => ({
                        positions: Array(this.numPlayers).fill(0),
                        cars: Array(this.numPlayers).fill(this.carNames[0] || 'Carro 1'),
                        fastestLap: null
                    }));
                },

                updatePlayerCount() {
                    const diff = this.numPlayers - this.players.length;
                    if (diff > 0) {
                        for (let i = 0; i < diff; i++) {
                            this.players.push(`Piloto ${this.players.length + 1}`);
                        }
                    } else if (diff < 0) {
                        this.players = this.players.slice(0, this.numPlayers);
                    }

                    // Re-adjust results array sizes
                    this.trackResults.forEach(res => {
                        if (res.positions.length < this.numPlayers) {
                            while (res.positions.length < this.numPlayers) {
                                res.positions.push(0);
                                res.cars.push(this.carNames[0] || 'Carro 1');
                            }
                        } else if (res.positions.length > this.numPlayers) {
                            res.positions = res.positions.slice(0, this.numPlayers);
                            res.cars = res.cars.slice(0, this.numPlayers);
                        }
                        if (res.fastestLap !== null && res.fastestLap >= this.numPlayers) {
                            res.fastestLap = null;
                        }
                    });
                },

                updateTrackCount() {
                    const diff = this.numTracks - this.trackNames.length;
                    if (diff > 0) {
                        for (let i = 0; i < diff; i++) {
                            const nextIndex = this.trackNames.length;
                            this.trackNames.push(this.defaultTracks[nextIndex] || `Pista ${nextIndex + 1}`);
                            this.trackResults.push({
                                positions: Array(this.numPlayers).fill(0),
                                cars: Array(this.numPlayers).fill(this.carNames[0] || 'Carro 1'),
                                fastestLap: null
                            });
                        }
                    } else if (diff < 0) {
                        this.trackNames = this.trackNames.slice(0, this.numTracks);
                        this.trackResults = this.trackResults.slice(0, this.numTracks);
                    }
                },

                updateCarCount() {
                    const diff = this.numCars - this.carNames.length;
                    if (diff > 0) {
                        for (let i = 0; i < diff; i++) {
                            this.carNames.push(`Carro ${this.carNames.length + 1}`);
                        }
                    } else if (diff < 0) {
                        this.carNames = this.carNames.slice(0, this.numCars);
                        // Fallback invalid cars
                        this.trackResults.forEach(res => {
                            res.cars = res.cars.map(c => this.carNames.includes(c) ? c : this.carNames[0]);
                        });
                    }
                },

                startChampionship() {
                    this.started = true;
                    this.currentTab = 'standings';
                    this.saveToLocalStorage();
                },

                saveToLocalStorage() {
                    const data = {
                        started: this.started,
                        numPlayers: this.numPlayers,
                        numTracks: this.numTracks,
                        numCars: this.numCars,
                        fastestLapBonusEnabled: this.fastestLapBonusEnabled,
                        players: this.players,
                        carNames: this.carNames,
                        trackNames: this.trackNames,
                        trackResults: this.trackResults
                    };
                    localStorage.setItem('assetto_corsa_championship_data', JSON.stringify(data));
                },

                isPositionTaken(trackIndex, playerIndex, position) {
                    const positions = this.trackResults[trackIndex].positions;
                    return positions.some((pos, pIdx) => pIdx !== playerIndex && pos === position && pos !== 0);
                },

                toggleFastestLap(trackIndex, playerIndex) {
                    if (this.trackResults[trackIndex].fastestLap === playerIndex) {
                        this.trackResults[trackIndex].fastestLap = null;
                    } else {
                        this.trackResults[trackIndex].fastestLap = playerIndex;
                    }
                    this.saveToLocalStorage();
                },

                getPointsForTrackAndPlayer(trackIndex, playerIndex) {
                    const pos = this.trackResults[trackIndex].positions[playerIndex];
                    let pts = 0;
                    if (pos > 0 && pos <= this.scoringScheme.length) {
                        pts = this.scoringScheme[pos - 1] || 0;
                    }
                    if (this.fastestLapBonusEnabled && this.trackResults[trackIndex].fastestLap === playerIndex) {
                        pts += 1;
                    }
                    return pts;
                },

                getAssignedCount(trackIndex) {
                    return this.trackResults[trackIndex].positions.filter(pos => pos > 0).length;
                },

                isTrackCompleted(trackIndex) {
                    return this.getAssignedCount(trackIndex) === this.numPlayers;
                },

                get completedTracksCount() {
                    let count = 0;
                    for (let i = 0; i < this.numTracks; i++) {
                        if (this.isTrackCompleted(i)) count++;
                    }
                    return count;
                },

                autoFillRandom(trackIndex) {
                    let availablePos = Array.from({ length: this.numPlayers }, (_, i) => i + 1);
                    // Shuffle positions
                    for (let i = availablePos.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [availablePos[i], availablePos[j]] = [availablePos[j], availablePos[i]];
                    }
                    this.trackResults[trackIndex].positions = availablePos;
                    if (this.carNames.length > 0) {
                        this.trackResults[trackIndex].cars = Array.from({ length: this.numPlayers }, () => 
                            this.carNames[Math.floor(Math.random() * this.carNames.length)]
                        );
                    }
                    if (this.fastestLapBonusEnabled) {
                        this.trackResults[trackIndex].fastestLap = Math.floor(Math.random() * this.numPlayers);
                    }
                    this.saveToLocalStorage();
                },

                clearTrack(trackIndex) {
                    this.trackResults[trackIndex].positions = Array(this.numPlayers).fill(0);
                    this.trackResults[trackIndex].fastestLap = null;
                    this.saveToLocalStorage();
                },

                get sortedStandings() {
                    const list = this.players.map((name, pIndex) => {
                        let totalPoints = 0;
                        let wins = 0;
                        let podiums = 0;
                        let fastLaps = 0;
                        let roundScores = [];

                        for (let t = 0; t < this.numTracks; t++) {
                            const pts = this.getPointsForTrackAndPlayer(t, pIndex);
                            const pos = this.trackResults[t].positions[pIndex];
                            
                            roundScores.push(pts);
                            totalPoints += pts;

                            if (pos === 1) wins++;
                            if (pos >= 1 && pos <= 3) podiums++;
                            if (this.fastestLapBonusEnabled && this.trackResults[t].fastestLap === pIndex) fastLaps++;
                        }

                        return {
                            id: pIndex,
                            name: name || `Piloto ${pIndex + 1}`,
                            totalPoints,
                            wins,
                            podiums,
                            fastLaps,
                            roundScores
                        };
                    });

                    // Sort rule: Total Points -> Wins -> Podiums -> Fast Laps
                    return list.sort((a, b) => {
                        if (b.totalPoints !== a.totalPoints) return b.totalPoints - a.totalPoints;
                        if (b.wins !== a.wins) return b.wins - a.wins;
                        if (b.podiums !== a.podiums) return b.podiums - a.podiums;
                        return b.fastLaps - a.fastLaps;
                    });
                },

                getDriverColor(pIndex) {
                    const colors = ['#e11d48', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4', '#84cc16', '#d97706', '#64748b'];
                    return colors[pIndex % colors.length];
                },

                getTopStatDriver(prop) {
                    const standings = [...this.sortedStandings];
                    if (standings.length === 0) return null;
                    return standings.sort((a, b) => b[prop] - a[prop])[0];
                },

                getPointPercentage(points) {
                    const maxPts = this.sortedStandings[0]?.totalPoints || 1;
                    return maxPts > 0 ? Math.round((points / maxPts) * 100) : 0;
                },

                resetChampionship() {
                    localStorage.removeItem('assetto_corsa_championship_data');
                    this.started = false;
                    this.currentTab = 'standings';
                    this.initTrackResults();
                },

                exportData() {
                    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({
                        started: this.started,
                        numPlayers: this.numPlayers,
                        numTracks: this.numTracks,
                        numCars: this.numCars,
                        fastestLapBonusEnabled: this.fastestLapBonusEnabled,
                        players: this.players,
                        carNames: this.carNames,
                        trackNames: this.trackNames,
                        trackResults: this.trackResults
                    }));
                    const downloadAnchor = document.createElement('a');
                    downloadAnchor.setAttribute("href", dataStr);
                    downloadAnchor.setAttribute("download", `Assetto_Corsa_Campeonato_${new Date().toISOString().slice(0,10)}.json`);
                    document.body.appendChild(downloadAnchor);
                    downloadAnchor.click();
                    downloadAnchor.remove();
                },

                importData(event) {
                    const file = event.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            const parsed = JSON.parse(e.target.result);
                            this.started = parsed.started;
                            this.numPlayers = parsed.numPlayers;
                            this.numTracks = parsed.numTracks || 6;
                            this.numCars = parsed.numCars || 3;
                            this.fastestLapBonusEnabled = parsed.fastestLapBonusEnabled;
                            this.players = parsed.players;
                            this.carNames = parsed.carNames || ['Porsche 911 GT3 R'];
                            this.trackNames = parsed.trackNames;
                            this.trackResults = parsed.trackResults;
                            this.saveToLocalStorage();
                            alert("Dados importados com sucesso!");
                        } catch (err) {
                            alert("Erro ao importar o arquivo. Verifique o formato JSON.");
                        }
                    };
                    reader.readAsText(file);
                }
            };
        }
    </script>
